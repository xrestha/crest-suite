<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      viewport-fit=cover is not cosmetic: without it env(safe-area-inset-*) resolves to 0 on every
      iPhone, so the Crest Staff portal's fixed bottom tab bar would sit under the home indicator
      with its safe-area padding silently doing nothing. It is also what the black-translucent
      status-bar style below has always assumed.
      Deliberately NO maximum-scale / user-scalable=no: pinning the viewport blocks pinch-zoom for
      everyone, which is an accessibility failure. The 16px input floor in selfService.css is what
      stops iOS auto-zooming on field focus instead.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191817" />
    <meta name="description" content="Food cost & inventory management for Nepal hospitality" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crest Suite" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Crest Suite</title>
    <!--
      Before the app's JavaScript arrives there is nothing on the page, and on a slow connection that
      was a WHITE screen for many seconds (measured on throttled 3G) — then the dark app. The ground is
      the default preset's (Modernist Night, the same #191817 as theme-color above) so the first paint
      already matches the app and the guest QR menu, and #root holds one quiet line until React
      replaces it. Inline style is allowed by the CSP (style-src 'unsafe-inline'); an inline script
      would not be, which is why this is CSS and plain markup only.
    -->
    <style>
      html, body { background: #191817; }
      .boot-loading { min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font: 13px/1.4 Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #9b9797; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="boot-loading" role="status">Loading…</div></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
